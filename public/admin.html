<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Chismografo de Chayo</title>
    <link rel="icon" type="image/png" href="img/sticker-smiley.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-panel">
        <!-- Header con botón de cerrar sesión -->
        <div class="admin-header">
            <h1>Panel de Administración</h1>
            <button id="logout-btn" class="logout-btn" title="Cerrar sesión">
                ← Volver al Login
            </button>
        </div>

        <div class="grupo-actual">
            <span>Administrando: <strong id="grupo-actual-nombre">…</strong></span>
            <button id="cambiar-grupo-btn" class="logout-btn-small" title="Cambiar de chismógrafo">Cambiar</button>
        </div>

        <div class="admin-section">
            <h2>Chismógrafos (grupos)</h2>
            <div id="grupos-list">
                <p class="loading-text">Cargando grupos...</p>
            </div>
            <div class="admin-crear-fila">
                <input type="text" id="nuevo-grupo-codigo" placeholder="código a mano (opcional)">
                <button id="generar-grupo-btn">Generar código nuevo</button>
            </div>
        </div>

        <div class="admin-section">
            <h2>Amigos registrados (entraron con Google)</h2>
            <div id="users-list">
                <p class="loading-text">Cargando cuentas...</p>
            </div>
        </div>

        <div class="admin-section">
            <h2>Preguntas de este chismógrafo</h2>
            <div id="preguntas-list">
                <p class="loading-text">Cargando preguntas...</p>
            </div>
            <div class="admin-crear-fila">
                <input type="text" id="nueva-pregunta-texto" placeholder="Nueva pregunta...">
                <button id="crear-pregunta-btn">Agregar</button>
            </div>
        </div>

        <div class="admin-section">
            <h2>Respuestas de este chismógrafo</h2>
            <div id="respuestas-list">
                <p class="loading-text">Cargando respuestas...</p>
            </div>
            <div class="admin-crear-fila admin-crear-respuesta">
                <input type="text" id="nueva-resp-usuario" placeholder="Usuario">
                <input type="text" id="nueva-resp-pregunta" placeholder="Pregunta">
                <input type="text" id="nueva-resp-texto" placeholder="Respuesta">
                <button id="crear-respuesta-btn">Agregar</button>
            </div>
        </div>

    </div>

    <script src="js/admin.js"></script>
</body>
</html>
