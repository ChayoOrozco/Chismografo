<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chismografo de Chayo</title>
    <link rel="icon" type="image/png" href="img/sticker-smiley.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <main class="contenedor-principal">
        <form class="login-etiqueta" id="login-form">
            <img src="img/sticker-yin-yang.png" alt="Sticker Yin-Yang" class="sticker sticker-1">
            <img src="img/sticker-smiley.png" alt="Sticker Carita Feliz" class="sticker sticker-2">
            <img src="img/sticker-star.png" alt="Sticker Estrella" class="sticker sticker-3">

            <h1 id="titulo-principal">Chismografo de Chayo</h1>

            <!-- SECCIÓN LOGIN CON GOOGLE -->
            <div id="login-familiar">
                <p class="google-login-hint">Entra con tu cuenta de Google para chismosear:</p>
                <div id="google-btn"></div>
                <p id="google-login-error" class="hidden" style="color:#ff4444;"></p>
            </div>

            <!-- SECCIÓN LOGIN ADMIN (oculta) -->
            <div id="login-admin" class="hidden">
                <div class="form-grupo">
                    <label for="adminUser">Usuario Admin:</label>
                    <input type="text" id="adminUser" name="adminUser">
                </div>
                <div class="form-grupo">
                    <label for="adminPass">Contraseña Admin:</label>
                    <input type="password" id="adminPass" name="adminPass">
                </div>
                <button type="submit" id="boton-submit">Acceder</button>
            </div>

            <!-- ENLACES PARA CAMBIAR DE MODO -->
            <div class="switch-links">
                <!-- El ID de este enlace es 'ir-a-admin' -->
                <a href="#" id="ir-a-admin">Acceso Admin</a>
                <!-- El ID de este enlace es 'ir-a-familiar' -->
                <a href="#" id="ir-a-familiar" class="hidden">« Volver al login con Google</a>
            </div>
        </form>

        <!-- SECCIÓN ELEGIR CHISMÓGRAFO (aparece tras el login con Google) -->
        <div class="login-etiqueta hidden" id="seleccionar-grupo">
            <h1>¿A cuál chismógrafo entras?</h1>
            <p class="google-login-hint">Escribe el código que te compartieron (ej. amigos, familia, familia-isra). Si es nuevo, se crea solo.</p>
            <div class="form-grupo">
                <label for="grupo-codigo">Código del chismógrafo:</label>
                <input type="text" id="grupo-codigo" name="grupo-codigo" placeholder="amigos">
            </div>
            <button type="button" id="boton-entrar-grupo">¡Entrar!</button>
            <p id="grupo-error" class="hidden" style="color:#ff4444;"></p>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
